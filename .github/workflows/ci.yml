name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test -w @waylix/engine
      - name: Server tests
        run: npm test -w @waylix/server
      - name: Typecheck (engine, server, mobile)
        run: npm run typecheck
      - name: Bundle mobile JS (Android + iOS)
        working-directory: apps/mobile
        run: |
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform ios --output-dir /tmp/export-ios
