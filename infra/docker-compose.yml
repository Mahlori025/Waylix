# Waylix self-hosted stack.
#   docker compose -f infra/docker-compose.yml up -d api
#   docker compose -f infra/docker-compose.yml --profile routing up -d   # + private OSRM (car + foot)
#
# Before using the routing profile, prepare OSM data once (South Africa ≈ 350 MB):
#   ./infra/prepare-osrm.sh south-africa
services:
  api:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    ports: ["8787:8787"]
    environment:
      WAYLIX_API_KEYS: ${WAYLIX_API_KEYS:-}
      WAYLIX_RATE_LIMIT: ${WAYLIX_RATE_LIMIT:-240}
    volumes: ["waylix-data:/data"]
    restart: unless-stopped

  osrm-car:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/car/region.osrm
    volumes: ["./osrm:/data"]
    ports: ["5000:5000"]
    restart: unless-stopped

  osrm-foot:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/foot/region.osrm
    volumes: ["./osrm:/data"]
    ports: ["5001:5000"]
    restart: unless-stopped

volumes:
  waylix-data:
